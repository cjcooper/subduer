# cargo-about config for THIRD-PARTY-NOTICES.txt; regenerate with
# tools/third-party-notices.sh. A crate under a license not listed here fails
# the run, so a new license gets a look before it ships.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Everything the app ships for, so one file covers every installer.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

# Only what ends up in the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Leave out our own workspace crates (publish = false).
private = { ignore = true }
