[workspace]
resolver = "3"
members = ["crates/types", "crates/core", "src-tauri", "ui"]
default-members = ["crates/types", "crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
subduer-types = { path = "crates/types" }
subduer-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
