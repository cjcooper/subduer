[package]
name = "subduer-ui"
description = "Leptos (WASM) frontend for k8s-subduer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
subduer-types.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Storage", "DataTransfer", "DragEvent", "PointerEvent", "Element", "DomRect", "HtmlCollection", "MediaQueryList", "Location", "File", "FileList", "Blob", "HtmlInputElement", "HtmlSelectElement", "Navigator"] }
