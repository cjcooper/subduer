# Builds Subduer natively on each desktop OS. Each runner produces the
# bundles for its own system (see src-tauri/tauri.<os>.conf.json):
#   macOS   → .app and .dmg
#   Linux   → .deb, .rpm and .AppImage
#   Windows → NSIS .exe installer and .msi
# Bundles are unsigned and kept as workflow artifacts for 14 days.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk and the Tauri CLI
        run: cargo install --locked trunk@0.21.14 tauri-cli@2.12.1

      - name: Test
        run: cargo test

      - name: UI unit tests
        run: cargo test -p subduer-ui

      # The real UI in headless Chrome against the harness stubs. The script
      # assumes macOS paths (Chrome's app bundle).
      - name: UI end-to-end tests
        if: runner.os == 'macOS'
        run: python3 tools/ui-harness/run_e2e.py

      - name: Coverage report
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-llvm-cov
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --summary-only

      - name: Build bundles
        run: cargo tauri build
        env:
          # AppImage tooling runs without FUSE on CI runners.
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: subduer-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
