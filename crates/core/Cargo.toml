[package]
name = "subduer-core"
description = "Kubernetes access for k8s-subduer: contexts, discovery, watches, actions, safety gate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
subduer-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
kube = { version = "4.2", features = ["runtime", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
futures = "0.3"
http = "1"
form_urlencoded = "1"
base64 = "0.22"
flate2 = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "io-util", "net", "fs", "process"] }
serde_norway = "0.9"
jiff = "0.2"
tracing = "0.1"
# Only for the `test-support` feature: the fake API server in `testing.rs`.
tower = { version = "0.5", features = ["util"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }

[features]
# Exposes `subduer_core::testing` (a fake Kubernetes API server) to other
# crates' tests, e.g. src-tauri's command tests.
test-support = ["dep:tower", "dep:http-body-util", "dep:bytes"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# The fake API server in `testing.rs`.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
