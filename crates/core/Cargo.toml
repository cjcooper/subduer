[package]
name = "subduer-core"
description = "Kubernetes access for k8s-subduer: contexts, discovery, watches, actions, safety gate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
subduer-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
kube = { version = "4.2", features = ["runtime", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
serde_norway = "0.9"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
