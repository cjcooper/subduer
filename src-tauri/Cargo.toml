[package]
name = "subduer"
description = "Desktop app for browsing and controlling Kubernetes clusters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "subduer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
subduer-core.workspace = true
subduer-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["image-png"] }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
percent-encoding = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "2"
jiff = "0.2"

# The system accent colour (accent.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
# Command tests run against Tauri's mock runtime and a fake Kubernetes API.
subduer-core = { workspace = true, features = ["test-support"] }
tauri = { version = "2.12", features = ["image-png", "test"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
